<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Haajar - Profile Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;800&amp;family=JetBrains+Mono:wght@500;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#fff8f6",
                        "on-surface": "#271813",
                        "outline": "#8f7066",
                        "tertiary-container": "#96948f",
                        "surface-dim": "#f0d4cc",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-container-highest": "#f9dcd4",
                        "on-secondary-fixed": "#1a1c1e",
                        "secondary-fixed": "#e2e2e5",
                        "on-primary-fixed": "#390c00",
                        "secondary-container": "#e2e2e5",
                        "inverse-primary": "#ffb59c",
                        "on-primary-fixed-variant": "#832700",
                        "tertiary": "#605e5a",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-bright": "#fff8f6",
                        "secondary-fixed-dim": "#c6c6c9",
                        "on-tertiary-fixed-variant": "#484742",
                        "on-tertiary-fixed": "#1c1c18",
                        "secondary": "#5d5e61",
                        "surface-container-low": "#fff1ed",
                        "tertiary-fixed-dim": "#c9c6c0",
                        "primary-container": "#ff5f1f",
                        "on-primary-container": "#561700",
                        "surface-tint": "#ab3600",
                        "surface-container": "#ffe9e3",
                        "primary": "#ab3600",
                        "on-tertiary-container": "#2e2d29",
                        "background": "#fff8f6",
                        "on-secondary-container": "#636467",
                        "primary-fixed-dim": "#ffb59c",
                        "surface-variant": "#f9dcd4",
                        "on-secondary-fixed-variant": "#454749",
                        "primary-fixed": "#ffdbcf",
                        "tertiary-fixed": "#e6e2dc",
                        "inverse-surface": "#3d2c27",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#ffede8",
                        "outline-variant": "#e3bfb3",
                        "on-tertiary": "#ffffff",
                        "on-background": "#271813",
                        "surface-container-high": "#ffe2d9",
                        "on-surface-variant": "#5b4138",
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding": "20px",
                        "touch-target-min": "48px",
                        "base": "8px",
                        "gutter": "12px"
                    },
                    "fontFamily": {
                        "headline-md": ["Bricolage Grotesque"],
                        "button-text": ["JetBrains Mono"],
                        "headline-md-mobile": ["Bricolage Grotesque"],
                        "label-mono": ["JetBrains Mono"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "display-lg": ["Bricolage Grotesque"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "button-text": ["14px", { "lineHeight": "20px", "fontWeight": "700" }],
                        "headline-md-mobile": ["22px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "label-mono": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        .grid-bg {
            background-size: 24px 24px;
            background-image:
                linear-gradient(to right, #E8E4DE 1px, transparent 1px),
                linear-gradient(to bottom, #E8E4DE 1px, transparent 1px);
        }
        
        .form-input {
            border-radius: 0;
            box-shadow: none !important;
        }
        
        .form-input:focus {
            border-color: theme('colors.primary-container');
            border-width: 2px;
            outline: none;
            padding-left: 11px; /* adjust for border width change to avoid jumping */
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen relative grid-bg antialiased selection:bg-primary-container selection:text-white">
<!-- TopAppBar Semantic Shell: Suppressed due to Transactional Intent (Profile Setup / Onboarding) -->
<main class="w-full max-w-md mx-auto pt-16 pb-24 px-container-padding relative z-10 flex flex-col h-screen">
<!-- Header Section -->
<header class="mb-12">
<div class="inline-flex items-center space-x-2 mb-6">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">person_add</span>
<span class="font-label-mono text-label-mono text-on-surface-variant tracking-widest uppercase">Step 1 of 3</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface mb-4">Complete Profile</h1>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed max-w-[280px]">
                Please verify your information to establish your ledger identity within the system.
            </p>
</header>
<!-- Form Section -->
<form class="flex-grow flex flex-col space-y-6" onsubmit="event.preventDefault();">
<!-- Email Field (Read-only) -->
<div class="relative group">
<label class="block font-label-mono text-label-mono text-on-surface-variant mb-2" for="email">
                    [ EMAIL ]
                </label>
<div class="relative flex items-center">
<input class="form-input block w-full h-touch-target-min border border-[#1A1C1E] bg-[#E8E4DE] bg-opacity-30 text-on-surface font-body-md px-3 text-opacity-70 cursor-not-allowed" id="email" name="email" readonly="" type="email" value="mathews.j@gmail.com"/>
<span class="material-symbols-outlined absolute right-3 text-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<p class="mt-2 text-xs font-label-mono text-tertiary">Verified via primary provider.</p>
</div>
<!-- Full Name Field (Empty State) -->
<div class="relative">
<label class="block font-label-mono text-label-mono text-on-surface mb-2" for="fullname">
                    [ NAME ]
                </label>
<input class="form-input block w-full h-touch-target-min border border-[#1A1C1E] bg-white text-on-surface font-body-md px-3 placeholder-tertiary placeholder-opacity-60 font-label-mono transition-all duration-200" id="fullname" name="fullname" placeholder="[ ENTER FULL NAME ]" type="text"/>
</div>
<!-- Phone Number Field (Focused State Simulation) -->
<div class="relative">
<label class="block font-label-mono text-label-mono text-primary-container mb-2 font-bold" for="phone">
                    [ PHONE ]
                </label>
<div class="relative flex items-center">
<span class="absolute left-3 font-label-mono text-on-surface-variant">+1</span>
<input autofocus="" class="form-input block w-full h-touch-target-min border-2 border-primary-container bg-white text-on-surface font-label-mono px-3 pl-[3.5rem] transition-all duration-200 focus:border-primary-container focus:ring-0" id="phone" name="phone" type="tel" value="(555) 019-"/>
<!-- Blinking Cursor Simulation -->
<div class="absolute left-[8.5rem] w-[2px] h-5 bg-primary-container animate-pulse"></div>
</div>
</div>
<!-- Spacer to push button to bottom -->
<div class="flex-grow"></div>
<!-- Action Button -->
<div class="pt-8 pb-container-padding sticky bottom-0 bg-surface bg-opacity-90 backdrop-blur-sm">
<button class="w-full h-touch-target-min bg-primary-container text-white font-button-text text-button-text flex items-center justify-center space-x-2 transition-transform duration-150 active:scale-[0.98] border border-transparent hover:bg-[#E5551C]" type="submit">
<span>[ SAVE AND CONTINUE ]</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</main>
<!-- BottomNavBar Semantic Shell: Suppressed due to Transactional Intent -->
<script>
        // Force focus on phone field to maintain the visual state if user clicks around
        window.onload = function() {
            document.getElementById('phone').focus();
        };
    </script>
</body></html>
