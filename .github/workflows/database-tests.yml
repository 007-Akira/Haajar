name: Database tests

on:
  pull_request:
    paths:
      - ".github/workflows/database-tests.yml"
      - "supabase/**"
      - "docs/database-testing.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/database-tests.yml"
      - "supabase/**"
      - "docs/database-testing.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_NON_INTERACTIVE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Show tool versions
        run: |
          docker --version
          supabase --version

      - name: Start isolated local Supabase
        run: supabase start

      - name: Apply all migrations to a clean database
        run: supabase db reset --local --no-seed

      - name: Lint local database
        run: supabase db lint --local --level error

      - name: Check migration schema drift
        run: |
          supabase db diff --local --schema public,private > /tmp/haajar-schema-drift.sql
          if grep -Eiq '^(create|alter|drop|grant|revoke|comment|insert|update|delete)[[:space:]]' /tmp/haajar-schema-drift.sql; then
            echo "Schema drift detected after applying migrations."
            cat /tmp/haajar-schema-drift.sql
            exit 1
          fi

      - name: Enable disposable concurrency test connections
        run: |
          db_container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}' | head -n 1)"
          test -n "$db_container"
          docker exec "$db_container" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            -c "grant execute on function extensions.dblink_connect_u(text,text) to postgres, supabase_admin;"

      - name: Run every pgTAP suite
        run: supabase test db

      - name: Write safe failure diagnostics
        if: failure()
        run: |
          mkdir -p /tmp/haajar-db-diagnostics
          docker ps --all --filter "name=supabase_" --format "{{.Names}} {{.Status}}" > /tmp/haajar-db-diagnostics/container-status.txt
          find supabase/tests -type f -name '*.sql' -print | sort > /tmp/haajar-db-diagnostics/discovered-tests.txt
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | sort > /tmp/haajar-db-diagnostics/discovered-migrations.txt
          printf '%s\n' "Database workflow failed. Re-run the failing named pgTAP suite locally for TAP output." > /tmp/haajar-db-diagnostics/README.txt

      - name: Upload safe failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-test-diagnostics
          path: /tmp/haajar-db-diagnostics
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
